packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  # Its install script only prints a funding message (reached through
  # @clerk/ui); nothing is built.
  core-js: false
  esbuild: true
  lightningcss: true
  unrs-resolver: true

# Security floors for transitive dependencies, scoped to the vulnerable range.
# Remove an entry once its parent package requires the fixed version itself.
# https://pnpm.io/settings#overrides
overrides:
  # solid-js below 1.9.16 depends on seroval 1.5.x (GHSA-p6vx-979v-rg4c,
  # critical; GHSA-jp82-f5mq-hwhp, high). Reached through @tanstack/devtools.
  "solid-js@<1.9.16": "^1.9.17"

# Advisories accepted after review, so `pnpm audit` (and CI) fails only on new
# ones. Remove an entry once a fixed version is released. https://pnpm.io/cli/audit
audit:
  ignore:
    # braces: deeply nested patterns can exhaust the stack. Reached only
    # through the shadcn CLI's file globbing (packages/ui), which runs at dev
    # time on our own paths; no fixed version exists yet.
    - GHSA-vfj7-8cjw-p6xm

# Every dependency's version is defined once, here, as an exact version, and
# packages write "catalog:" instead of a version. strict: `pnpm add` may only
# use catalog versions, so a second version can't creep in.
# https://pnpm.io/catalogs
catalogMode: strict

catalog:
  "@base-ui/react": 1.9.0
  "@clerk/backend": 3.24.0
  "@clerk/tanstack-react-start": 1.7.2
  "@clerk/ui": 1.40.2
