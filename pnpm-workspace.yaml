packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  esbuild: true
  lightningcss: true
  unrs-resolver: true
  msw: false

# One version per shared dependency: packages write "catalog:" instead of a
# version. strict: `pnpm add` may only use catalog versions, so a second
# version of a dependency can't creep in. https://pnpm.io/catalogs
catalogMode: strict

catalog:
  "@tailwindcss/vite": 4.3.3
  "@tanstack/eslint-config": 0.4.0
  "@tanstack/react-virtual": 3.14.19
  "@types/node": 22.20.5
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  "eslint": 10.12.0
  "lucide-react": 1.57.0
  "react": 19.3.0
  "react-dom": 19.3.0
  "tailwindcss": 4.3.3
  "typescript": 6.0.3
