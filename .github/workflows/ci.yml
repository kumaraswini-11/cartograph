name: CI

on:
  push:
    branches: [main]
  pull_request:

# CI only reads the repository.
permissions:
  contents: read

# A new push to a pull request cancels its run in progress. Runs on main are
# never cancelled, so every commit on main gets a complete result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  check:
    name: Audit, format, lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Actions are pinned to a full commit SHA (the release tag is in the
    # comment), so a moved or compromised tag can't change what runs.
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, so `turbo run --affected` can compare with the base branch
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm (version from packageManager in package.json)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # The one Node version the app uses everywhere: locally, here, and in
      # production (engines in package.json sets it on Vercel).
      - name: Set up Node.js (version from .node-version)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit

      - name: Check formatting
        run: pnpm format:check

      - name: Lint, typecheck, test and build
        run: pnpm turbo run lint typecheck test build --affected
