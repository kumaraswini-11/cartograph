name: Database migrations

# The deployed database gets its schema only from the migrations in the
# repository, applied here, never by hand in Supabase's console (spec 007,
# C-03, plan D-05). Every change on main that touches a migration applies
# the ones the database doesn't have yet; a run can also be started by hand.
on:
  push:
    branches: [main]
    paths: ["packages/database/supabase/migrations/**"]
  workflow_dispatch:

permissions:
  contents: read

# One run at a time, and never cancelled halfway through a migration.
concurrency:
  group: database-migrations
  cancel-in-progress: false

jobs:
  push:
    name: Apply migrations to production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    # Repository secrets: a scoped Supabase personal access token, the
    # production database's password and its project ref.
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    defaults:
      run:
        working-directory: packages/database

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm (version from packageManager in package.json)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js (version from .node-version)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Show the migrations to apply
        run: pnpm exec supabase db push --project-ref "$SUPABASE_PROJECT_ID" --dry-run

      - name: Apply them
        run: pnpm exec supabase db push --project-ref "$SUPABASE_PROJECT_ID" --yes
